# Postgres 16 cho test (NFR08). Tách khỏi DB dev: cổng 54329, DB nckh_test, dữ liệu trên tmpfs (mất khi down).
# Mật khẩu "postgres" chỉ dùng cục bộ, không phải bí mật.
services:
  db-test:
    image: postgres:16
    container_name: nckh-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nckh_test
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres-test/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nckh_test"]
      interval: 2s
      timeout: 3s
      retries: 30
