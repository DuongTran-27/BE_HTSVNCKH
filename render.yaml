# T706: Render Blueprint cho API. Giá trị bí mật KHÔNG nằm ở đây (sync: false = nhập tay trên dashboard). Hướng dẫn: docs/VAN_HANH.md §6.
# Migrate KHÔNG chạy trên Render (T703c): chạy tay workflow .github/workflows/migrate.yml TRƯỚC khi deploy bản có migration mới,
# nên Render chỉ giữ DATABASE_URL của role nckh_app, không có DIRECT_URL (Prisma Client 5 không đọc DIRECT_URL lúc chạy – báo cáo T706a).
services:
  - type: web
    name: nckh-api
    runtime: node
    region: singapore # gần Supabase ap-southeast-1; đổi nếu project Supabase ở vùng khác
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npx -w @nckh/api prisma generate # prisma CLI là devDependency; NODE_ENV=production làm npm ci bỏ dev
    startCommand: node apps/api/src/server.js
    healthCheckPath: /api/health
    autoDeploy: false # deploy tay sau khi migrate (§6.3), tránh code mới chạy trên schema cũ
    envVars:
      - key: NODE_VERSION
        value: '24' # engines >=22.22.0; khuyến nghị 24.x
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_FOLDER
        value: nckh/production # đặt tường minh, trùng biến repo CLOUDINARY_FOLDER của job dọn mồ côi (VAN_HANH §3.4)
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render tự sinh chuỗi ngẫu nhiên 256 bit
      - key: DATABASE_URL
        sync: false # pooler 6543 ?pgbouncer=true&connection_limit=1, role nckh_app (VAN_HANH §5.2)
      - key: CORS_ORIGIN
        sync: false # https://<domain Vercel>, nhiều domain cách nhau bằng dấu phẩy, không khoảng trắng
      - key: CLOUDINARY_URL
        sync: false
      - key: CRON_SECRET
        sync: false # >= 32 ký tự, trùng secret CRON_SECRET của GitHub Actions
      - key: ORIGIN_SECRET
        sync: false # >= 32 ký tự, trùng ORIGIN_SECRET của Vercel; API kiểm từ T706 bước B
      # DC-20: đăng nhập Google (FR28) và email thông báo (FR29). Tùy chọn: thiếu một biến của nhóm thì tính năng tắt êm (tên nhóm: GOOGLE_ENV_KEYS, SMTP_ENV_KEYS trong apps/api/src/config/env.js). Hướng dẫn: VAN_HANH §6.5, §6.6
      - key: PUBLIC_APP_URL
        sync: false # https://<domain Vercel>, không có / ở cuối; production bắt buộc https (cả Google lẫn SMTP dùng)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false # danh sách tên miền email trường, cách nhau dấu phẩy, vd. vanlanguni.vn,vlu.edu.vn
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false # 465 (SSL, SMTP_SECURE tự bật) hoặc 587 (STARTTLS, đặt SMTP_SECURE=false)
      - key: SMTP_SECURE
        sync: false # tùy chọn: true/false; bỏ qua thì mặc định true khi cổng 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false # vd. NCKH Khoa CNTT <no-reply@<tên miền>>
