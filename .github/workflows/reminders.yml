# T502 (FR13): lịch gọi POST /api/cron/reminders (T501) để sinh thông báo nhắc hạn. Cấu hình secret: docs/VAN_HANH.md §4.
name: Reminders

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 08:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Gọi endpoint nhắc hạn
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }} # domain Vercel, ví dụ https://<app>.vercel.app (không / cuối, không /api); gọi thẳng onrender.com bị 404 (T706)
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$API_BASE_URL" || { echo "Thiếu secret API_BASE_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Thiếu secret CRON_SECRET"; exit 1; }
          # Header đi qua stdin (-K -) để không lộ trong danh sách tiến trình; URL không in ra log.
          # --retry chỉ thử lại lỗi tạm thời (timeout, 408/429/5xx khi Render free ngủ đông); 401/404 dừng ngay.
          # Endpoint idempotent nên gọi lại an toàn (dedupeKey, remindedAt). Lỗi thì in thân phản hồi rồi thoát.
          printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" | curl --silent --show-error --fail-with-body \
            --connect-timeout 30 --max-time 120 --retry 4 --retry-delay 30 \
            -X POST -K - -o response.json -w 'HTTP %{http_code}\n' "${API_BASE_URL%/}/api/cron/reminders" \
            || { rc=$?; cat response.json 2>/dev/null; echo; exit "$rc"; }
          cat response.json
