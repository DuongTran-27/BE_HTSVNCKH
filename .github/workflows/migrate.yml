# T706 (T703c mục 4): chạy `prisma migrate deploy` NGOÀI Render, chỉ chạy tay. Render chỉ giữ DATABASE_URL của role nckh_app.
# Role chạy migration = postgres (chủ bảng): ALTER DEFAULT PRIVILEGES ở VAN_HANH §3.1/§5.1 dựa trên điều này – đổi role thì sửa cả hai.
name: Migrate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # bật "Required reviewers" cho environment này nếu muốn duyệt trước khi chạy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: prisma migrate deploy + status
        env:
          # Session pooler cổng 5432 (không dùng 6543), role postgres. Prisma Migrate dùng DIRECT_URL nên đặt cả hai.
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          test -n "$DIRECT_URL" || { echo "Thiếu secret MIGRATE_DATABASE_URL"; exit 1; }
          npx prisma migrate deploy
          npx prisma migrate status
