# T608 (FR26): sao lưu pg_dump hằng ngày, mã hóa, lưu artifact ngoài Supabase, giữ 7 bản mới nhất.
name: Backup

on:
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC = 03:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions: {}

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # xóa artifact cũ
    defaults:
      run:
        shell: bash # GitHub dùng -eo pipefail
    env:
      PG_IMAGE: postgres:17 # pg_dump phải >= phiên bản server Supabase (chưa ghim digest: chấp nhận, xem báo cáo)
    steps:
      - name: Từ chối repo public (đọc qua API, vì sự kiện schedule không có payload repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r PRIV BRANCH < <(gh api "repos/$GITHUB_REPOSITORY" --jq '"\(.private) \(.default_branch)"')
          [ "$PRIV" = true ] || { echo "Repo không private: từ chối sao lưu (dump chứa dữ liệu cá nhân)."; exit 1; }
          test -n "$BRANCH" || { echo "Không xác định được nhánh mặc định"; exit 1; }
          echo "DEFAULT_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: pg_dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }} # session pooler :5432 hoặc direct, KHÔNG dùng transaction pooler :6543
        run: |
          test -n "$BACKUP_DATABASE_URL" || { echo "Thiếu secret BACKUP_DATABASE_URL"; exit 1; }
          F="nckh-backup-$(date -u +%Y%m%d-%H%M%S).dump"
          docker run --rm -e BACKUP_DATABASE_URL "$PG_IMAGE" sh -c 'pg_dump --format=custom --schema=public --no-owner --no-privileges "$BACKUP_DATABASE_URL"' > "$F"
          test "$(stat -c %s "$F")" -gt 1024 || { echo "Bản dump quá nhỏ, coi như lỗi"; exit 1; }
          echo "BACKUP_FILE=$F" >> "$GITHUB_ENV"
      - name: Kiểm tra bản dump đọc được
        run: |
          docker run --rm -i "$PG_IMAGE" pg_restore --list < "$BACKUP_FILE" > toc.txt
          head -n 5 toc.txt
          rm toc.txt
      - name: Mã hóa (gpg AES256) và xóa bản rõ
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Thiếu secret BACKUP_PASSPHRASE"; exit 1; }
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$BACKUP_FILE.gpg" "$BACKUP_FILE"
          rm "$BACKUP_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}.gpg
          path: ${{ env.BACKUP_FILE }}.gpg
          retention-days: 30 # chặn trên; số bản thực tế do bước dọn bên dưới quyết định
          if-no-files-found: error
      - name: Giữ 7 bản mới nhất (chỉ artifact của run backup.yml trên nhánh mặc định)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ env.DEFAULT_BRANCH }}
        run: |
          test -n "$BRANCH" || { echo "Thiếu BRANCH"; exit 1; }
          RUN_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/backup.yml/runs?branch=$BRANCH&per_page=100" --jq '.workflow_runs[].id' | paste -sd, -)"
          export RUN_IDS
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[]' | jq -s '.' > artifacts.json
          node apps/api/scripts/backup-prune.js 7 < artifacts.json > delete-ids.txt
          while read -r id; do
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              echo "đã xóa artifact $id"
            fi
          done < delete-ids.txt
