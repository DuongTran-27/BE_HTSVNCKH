# T609 (G5, API_GD6 §9.5): lịch gọi POST /api/cron/similarity-rechecks – chạy lại FR06 cho lần gửi "chưa kiểm tra". Secret như reminders.yml (docs/VAN_HANH.md §4).
name: Similarity recheck

on:
  schedule:
    - cron: '15 * * * *' # mỗi giờ, phút 15
  workflow_dispatch:

permissions: {}

concurrency:
  group: similarity-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Gọi endpoint chạy lại FR06
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }} # domain Vercel, ví dụ https://<app>.vercel.app (không / cuối, không /api); gọi thẳng onrender.com bị 404 (T706)
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$API_BASE_URL" || { echo "Thiếu secret API_BASE_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Thiếu secret CRON_SECRET"; exit 1; }
          # Header đi qua stdin (-K -) để không lộ trong danh sách tiến trình; URL không in ra log.
          # --retry chỉ thử lại lỗi tạm thời (timeout, 408/429/5xx khi Render free ngủ đông); 401/404 dừng ngay.
          # Endpoint idempotent nên gọi lại an toàn (cập nhật có điều kiện, dedupeKey). Lỗi thì in thân phản hồi rồi thoát.
          printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" | curl --silent --show-error --fail-with-body \
            --connect-timeout 30 --max-time 120 --retry 4 --retry-delay 30 \
            -X POST -K - -o response.json -w 'HTTP %{http_code}\n' "${API_BASE_URL%/}/api/cron/similarity-rechecks" \
            || { rc=$?; cat response.json 2>/dev/null; echo; exit "$rc"; }
          cat response.json
