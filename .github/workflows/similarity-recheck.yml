# T609 (G5, API_GD6 §9.5): lịch gọi POST /api/cron/similarity-rechecks – chạy lại FR06 cho lần gửi "chưa kiểm tra". Secret như reminders.yml (docs/VAN_HANH.md §4).
name: Similarity recheck

on:
  schedule:
    - cron: '15 * * * *' # mỗi giờ, phút 15
  workflow_dispatch:

permissions: {}

concurrency:
  group: similarity-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Gọi endpoint chạy lại FR06
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }} # ví dụ https://<app>.onrender.com (không có dấu / cuối, không có /api)
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$API_BASE_URL" || { echo "Thiếu secret API_BASE_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Thiếu secret CRON_SECRET"; exit 1; }
          # Header đi qua stdin (-K -) để không lộ trong danh sách tiến trình; URL không in ra log.
          # --retry xử lý Render free ngủ đông (503/timeout); endpoint idempotent nên gọi lại an toàn (cập nhật có điều kiện, dedupeKey).
          printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" | curl --silent --show-error --fail-with-body \
            --connect-timeout 30 --max-time 120 --retry 4 --retry-delay 30 --retry-all-errors \
            -X POST -K - -o response.json -w 'HTTP %{http_code}\n' "${API_BASE_URL%/}/api/cron/similarity-rechecks"
          cat response.json
