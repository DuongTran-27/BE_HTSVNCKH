# T608/T403 (FR26): job dọn file mồ côi - lịch chạy DRY-RUN (liệt kê Cloudinary, in danh sách). --apply chạy tay, xem docs/VAN_HANH.md 3.4.
name: Cleanup orphans

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx -w @nckh/api prisma generate
      - name: Dry-run
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_FOLDER: ${{ vars.CLOUDINARY_FOLDER || 'nckh/production' }}
        run: node apps/api/scripts/cleanup-orphans.js
