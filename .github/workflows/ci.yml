# T202 (NFR09): lint + test mỗi PR. DB test = service container postgres:16 (QĐ docs/agents/design/QD_DB_TEST.md §1.1).
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử nhánh gốc để lấy danh sách file mới của PR
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci # giữ optional deps: binding rolldown/lightningcss/oxide của vite 8 (không dùng --omit=optional)
      - run: npm run lint
      - run: npm run format:check
      - name: Prettier cho file mới của PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=A -z "origin/$BASE_REF...HEAD" -- '*.js' '*.jsx' '*.json' '*.yml' '*.yaml' '*.css' \
            | xargs -0 -r npx prettier --check
      - run: npm run build -w @nckh/web

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22', '24'] # react-router 8.4 cần Node >= 22.22 (engines gốc)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # chỉ cho DB test dùng một lần, khớp apps/api/.env.test – không phải bí mật
          POSTGRES_DB: nckh_test
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nckh_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DB_TEST_DRIVER: external
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx -w @nckh/api prisma generate
      - run: npm run db:test:up # external: tạo pg_trgm/unaccent ở template1 + nckh_test, in bảng K1–K7
      - run: npm run db:test:reset
      - name: Địa chỉ server mà lớp kiểm mức DB thấy (kỳ vọng 172.x qua cầu Docker)
        working-directory: apps/api
        run: >-
          node -e 'process.loadEnvFile(".env.test"); const c = new (require("@prisma/client").PrismaClient)();
          c.$queryRawUnsafe("SELECT host(inet_server_addr()) AS a").then((r) => console.log("inet_server_addr =", r[0].a)).finally(() => c.$disconnect())'
      - run: npm test
      - name: Độ phủ module nghiệp vụ (apps/api/src/modules, packages/shared/src)
        if: matrix.node == '24'
        run: |
          npm run test:coverage
          node -e 'const t = require("./coverage/coverage-summary.json").total; console.log(["## Độ phủ module nghiệp vụ", "| Chỉ số | % |", "|---|---|", ...["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct} |`)].join("\n"))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24' && always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
